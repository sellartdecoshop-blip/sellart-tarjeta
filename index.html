body:before{content:"";position:fixed;inset:0;background:rgba(255,248,240,.72);z-index:-1}
.wrap{max-width:420px;margin:0 auto;padding:20px 16px 40px}
.logo{background:var(--rosa);border-radius:22px;padding:6px;text-align:center;box-shadow:0 6px 20px rgba(213,46,62,.15)}
.logo img{width:70%;display:block;margin:0 auto}
h1{font-weight:normal;font-size:26px;text-align:center;margin:22px 0 6px;color:var(--rojo)}
p.sub{text-align:center;margin:0 0 18px;line-height:1.45;font-size:16px}
.card{background:rgba(255,255,255,.82);border:1.5px solid var(--oro);border-radius:22px;padding:20px 16px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;justify-items:center}
.s{width:66px;height:66px;border-radius:50%;border:2px dashed var(--salvia);display:flex;align-items:center;justify-content:center;background:var(--crema);font-size:15px;color:var(--salvia);transition:.3s}
.s.on{border:2px solid var(--rojo);background:var(--rosa);color:var(--rojo);transform:rotate(-6deg)}
.s svg{width:32px;height:32px}.ow{background:#fff;border:1.5px dashed var(--rojo);border-radius:16px;padding:12px;font-size:14px;margin-bottom:14px;line-height:1.6}
.prog{text-align:center;margin:16px 0 4px;font-size:15px}
button{font:inherit;cursor:pointer}
.btn{display:block;width:100%;background:var(--rojo);color:#fff;border:0;border-radius:30px;padding:14px;font-size:17px;margin-top:12px}
.btn.alt{background:var(--salvia)}
input{width:100%;padding:12px;border:1.5px solid var(--salvia);border-radius:14px;font:inherit;font-size:16px;text-align:center;margin-top:12px;background:#fff;color:var(--tx)}
.msg{text-align:center;font-size:14px;min-height:20px;margin-top:8px;color:var(--rojo)}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.pk{aspect-ratio:3/4;border-radius:16px;border:2px solid var(--oro);background:var(--rosa);color:var(--rojo);display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;font-size:14px;line-height:1.25;transition:.4s}
.pk svg{width:44px;height:44px}
.pk.rev{background:var(--crema);transform:scale(1.05)}
.pk.off{opacity:.35;filter:grayscale(.6)}
.hide{display:none}
.big{font-size:22px;text-align:center;color:var(--rojo);margin:10px 0 0}

<h1 id="h1">Tu Tarjeta de Momentos</h1>
<p class="sub">Cada compra enciende un momento. Juntá <b id="n"></b> sellos y elegí tu sorpresa.</p>

<div class="ow hide" id="ow"></div>
<div class="card hide" id="c0"><p class="big" style="margin-top:0">¡Bienvenida!</p><p class="sub" style="margin:6px 0">Esta tarjeta es personal. ¿Cómo te llamás?</p><input id="nm" placeholder="Tu nombre" maxlength="30" autocomplete="off"><button class="btn" id="nb">Empezar mi tarjeta</button></div>
<div class="card" id="c1">
  <div class="grid" id="g"></div>
  <p class="prog" id="pr"></p>
  <button class="btn" id="b1">Sellar mi compra</button>
  <div id="cd" class="hide"><input id="in" placeholder="Código que te dio Sellart" autocomplete="off"><button class="btn alt" id="b2">Confirmar</button></div>
  <div class="msg" id="m"></div>
</div>

<div class="card hide" id="c2">
  <p class="big" id="t2">¡Completaste tu tarjeta!</p>
  <p class="sub" id="s2" style="margin-top:6px">Elegí una de las tres flores: adentro te espera una sorpresa.</p>
  <div class="pick" id="pk"></div>
  <a id="wa" class="btn hide" style="text-align:center;text-decoration:none" target="_blank" rel="noopener">Reclamar mi premio por WhatsApp</a>
</div>
<button class="mini" id="rs">Reiniciar tarjeta (prueba)</button>
</div>
<script>
// ====== CONFIGURACIÓN (editá acá) ======
var CFG={
  sellos:8,                       // compras necesarias
  secreto:"Enciendemomentos11",  // cambiala por la tuya: define los códigos diarios
  whatsapp:"5492352446861",       // tu WhatsApp con código de país
  codigosPorDia:4,               // cuántos códigos distintos hay por día
  premios:[{n:"¡Sorpresa misteriosa de Sellart! 🎁",peso:60},{n:"Una velita de regalo",peso:20},{n:"10% de descuento",peso:20}]
};
// =======================================
var K="sellart_tarjeta_v1",st={n:0,p:null};
try{var x=localStorage.getItem(K);if(x)st=JSON.parse(x)}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}}
function fk(o){var d=new Date();d.setDate(d.getDate()+o);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function cod(k){var h=5381,s=CFG.secreto+k;for(var i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return "SELL"+String(h%10000).padStart(4,"0")}
var $=function(i){return document.getElementById(i)};
var flame='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z"/></svg>';
var flor='<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="3" fill="#C9A25B"/><g opacity=".9"><circle cx="12" cy="5.5" r="3.5"/><circle cx="12" cy="18.5" r="3.5"/><circle cx="5.5" cy="12" r="3.5"/><circle cx="18.5" cy="12" r="3.5"/></g><circle cx="12" cy="12" r="2.6" fill="#C9A25B"/></svg>';
$("n").textContent=CFG.sellos;
function draw(){
  var g=$("g");g.innerHTML="";
  for(var i=0;i<CFG.sellos;i++){var d=document.createElement("div");d.className="s"+(i<st.n?" on":"");d.innerHTML=i<st.n?flame:(i+1);g.appendChild(d)}
  var f=CFG.sellos-st.n;
  $("pr").textContent=f>0?(st.n+" de "+CFG.sellos+" · te falta"+(f>1?"n ":" ")+f+" para tu sorpresa"):"¡Tarjeta completa!";
  $("b1").classList.toggle("hide",f<=0);
  if(f<=0)$("cd").classList.add("hide");
  $("c0").classList.toggle("hide",!!st.nombre);$("c1").classList.toggle("hide",!st.nombre);$("c2").classList.toggle("hide",f>0||!st.nombre);if(st.nombre)$("h1").textContent="Tarjeta de Momentos de "+st.nombre;
  if(f<=0)pick();
}
function pick(){
  var p=$("pk");p.innerHTML="";
  for(var i=0;i<3;i++){(function(i){var b=document.createElement("button");b.className="pk";b.innerHTML=flor;
    b.onclick=function(){reveal(i)};p.appendChild(b)})(i)}
  if(st.p!==null)reveal(st.i||0,true);
}
function reveal(i,again){
  if(st.p===null||st.p===undefined){var tot=0,q;CFG.premios.forEach(function(x){tot+=x.peso});q=Math.random()*tot;for(var z=0;z<CFG.premios.length;z++){q-=CFG.premios[z].peso;if(q<0){st.p=CFG.premios[z].n;break}}if(!st.p)st.p=CFG.premios[0].n;st.i=i;save()}
  var bs=$("pk").children;
  for(var k=0;k<3;k++){bs[k].disabled=true;if(k==st.i){bs[k].className="pk rev";bs[k].textContent=st.p}else bs[k].className="pk off"}
  $("t2").textContent="¡Felicitaciones!";
  $("s2").textContent="Tu sorpresa: "+st.p;
  var w=$("wa");w.classList.remove("hide");
  w.href="https://wa.me/"+CFG.whatsapp+"?text="+encodeURIComponent("¡Hola Sellart! Soy "+(st.nombre||"una clienta")+". Completé mi Tarjeta de Momentos y gané: "+st.p+" 🕯️");
}
$("nb").onclick=function(){var v=$("nm").value.trim();if(!v)return;st.nombre=v.slice(0,30);save();draw()};
$("b1").onclick=function(){$("cd").classList.toggle("hide");$("in").focus()};
$("b2").onclick=function(){
  var v=$("in").value.trim().toUpperCase();
  st.u=st.u||[];var hoy=fk(0);
  var ok=false;for(var k=1;k<=CFG.codigosPorDia;k++)if(v===cod(hoy+"-"+k))ok=true;
  if(ok&&st.u.indexOf(v)>-1){$("m").textContent="Ese código ya fue usado. Pedí uno nuevo en tu próxima compra.";return}
  if(ok){st.u.push(v);st.n++;save();$("in").value="";$("cd").classList.add("hide");$("m").textContent="¡Sello sumado! Gracias por elegirnos 🤍";draw()}
  else $("m").textContent="Ese código no es válido o ya venció. Pedíselo a Sellart."
};
$("rs").onclick=function(){st={n:0,p:null,u:[]};save();$("m").textContent="";$("t2").textContent="¡Completaste tu tarjeta!";$("s2").textContent="Elegí una de las tres flores: adentro te espera una sorpresa.";$("wa").classList.add("hide");draw()};
draw();
function codes(k){var a=[];for(var j=1;j<=CFG.codigosPorDia;j++)a.push(cod(k+"-"+j));return a.join(" · ")}
function panel(){var o=$("ow"),h="<b>Panel de Sellart (solo para vos)</b><br>";
 for(var i=0;i<7;i++){var d=new Date();d.setDate(d.getDate()+i);h+=(i?d.getDate()+"/"+(d.getMonth()+1):"HOY")+": <b>"+codes(fk(i))+"</b><br>"}
 o.innerHTML=h;o.classList.remove("hide")}
var tp=0,tt;document.querySelector(".logo img").onclick=function(){tp++;clearTimeout(tt);tt=setTimeout(function(){tp=0},2000);
 if(tp>=5){tp=0;var o=$("ow");o.innerHTML='<b>Solo Sellart</b><input id="pw" type="password" placeholder="Tu palabra secreta"><button class="btn alt" id="pb">Ver códigos</button>';o.classList.remove("hide");
 $("pb").onclick=function(){if($("pw").value.trim().toLowerCase()===CFG.secreto.toLowerCase())panel();else $("pw").value=""}}};
</script></body></html>
